---
name: M460
variants:
  - name: M460
    cores:
      - name: main
        type: armv7em
        core_access_options: !Arm
          ap: !v1 0
    memory_map:
      - !Ram
        range:
          start: 0x20000000
          end: 0x20040000
        cores:
          - main
      - !Nvm
        range:
          start: 0x0
          end: 0x100000
        cores:
          - main
        access:
          boot: true
    flash_algorithms:
      - M460_AP_1M
flash_algorithms:
  - name: M460_AP_1M
    description: "M460 APROM 1MB"
    default: true
    instructions: 
    pc_init: 0x10
    pc_uninit: 0x86
    pc_program_page: 0x150
    pc_erase_sector: 0xd6
    pc_erase_all: 0x9c
    pc_verify: 0x1d2
    data_section_offset: 0x2b0
    flash_properties:
      address_range:
        start: 0x0
        end: 0x100000
      page_size: 0x1000
      erased_byte_value: 0xff
      program_page_timeout: 80
      erase_sector_timeout: 180
      sectors:
        - size: 0x1000
          address: 0x0
      cores:
        - main
