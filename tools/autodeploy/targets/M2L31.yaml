---
name: M2L31
variants:
  - name: M2L31
    cores:
      - name: main
        type: armv8m
        core_access_options: !Arm
          ap: !v1 0
    memory_map:
      - !Ram
        range:
          start: 0x20000000
          end: 0x20010000
        cores:
          - main
      - !Nvm
        range:
          start: 0x0
          end: 0x80000
        cores:
          - main
        access:
          boot: true
    flash_algorithms:
      - M2L31_AP_512
flash_algorithms:
  - name: M2L31_AP_512
    description: "M2L31 APROM 512kB"
    default: true
    instructions: 
    pc_init: 0x0
    pc_uninit: 0xf8
    pc_program_page: 0x224
    pc_erase_sector: 0x124
    pc_verify: 0x370
    data_section_offset: 0x438
    flash_properties:
      address_range:
        start: 0x0
        end: 0x80000
      page_size: 0x80
      erased_byte_value: 0xff
      program_page_timeout: 100
      erase_sector_timeout: 180
      sectors:
        - size: 0x1000
          address: 0x0
      cores:
        - main
