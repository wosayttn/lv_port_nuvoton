---
name: M5531
variants:
  - name: M5531
    cores:
      - name: main
        type: armv8m
        core_access_options: !Arm
          ap: !v2 0x0
    memory_map:
      - !Ram
        range:
          start: 0x20100000
          end: 0x20200000
        cores:
          - main
      - !Nvm
        range:
          start: 0x100000
          end: 0x300000
        cores:
          - main
        access:
          boot: true
    flash_algorithms:
      - M5531_AP_2M
flash_algorithms:
  - name: M5531_AP_2M
    description: "M5531 APROM 2MB"
    default: true
    instructions: 
    pc_init: 0x0
    pc_uninit: 0xea
    pc_program_page: 0x1b2
    pc_erase_sector: 0x156
    pc_erase_all: 0x106
    pc_verify: 0x30c
    data_section_offset: 0x380
    flash_properties:
      address_range:
        start: 0x100000
        end: 0x300000
      page_size: 0x200
      erased_byte_value: 0xff
      program_page_timeout: 100
      erase_sector_timeout: 200
      sectors:
        - size: 0x2000
          address: 0x0
      cores:
        - main
