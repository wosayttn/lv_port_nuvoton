---
name: M2354
variants:
  - name: M2354
    cores:
      - name: main
        type: armv8m
        core_access_options: !Arm
          ap: !v1 0
    memory_map:
      - !Ram
        range:
          start: 0x20000000
          end: 0x20040000
        cores:
          - main
      - !Nvm
        range:
          start: 0x0
          end: 0x100000
        cores:
          - main
        access:
          boot: true
    flash_algorithms:
      - M2354_AP_1M
flash_algorithms:
  - name: M2354_AP_1M
    description: "M2354 APROM 1MB"
    default: true
    instructions: 
    pc_init: 0x0
    pc_uninit: 0xf0
    pc_program_page: 0x29c
    pc_erase_sector: 0x1e8
    pc_erase_all: 0x1a8
    pc_verify: 0x588
    data_section_offset: 0x668
    flash_properties:
      address_range:
        start: 0x0
        end: 0x100000
      page_size: 0x800
      erased_byte_value: 0xff
      program_page_timeout: 50
      erase_sector_timeout: 180
      sectors:
        - size: 0x800
          address: 0x0
      cores:
        - main
