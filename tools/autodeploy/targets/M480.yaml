---
name: M480
variants:
  - name: M480
    cores:
      - name: main
        type: armv7em
        core_access_options: !Arm
          ap: !v1 0
    memory_map:
      - !Ram
        range:
          start: 0x20000000
          end: 0x20028000
        cores:
          - main
      - !Nvm
        range:
          start: 0x0
          end: 0x80000
        cores:
          - main
        access:
          boot: true
    flash_algorithms:
      - M481_AP_512
flash_algorithms:
  - name: M481_AP_512
    description: "M480 512kB Flash AP"
    default: true
    instructions: 
    pc_init: 0x10
    pc_uninit: 0xe0
    pc_program_page: 0x3ce
    pc_erase_sector: 0x18a
    pc_verify: 0x480
    data_section_offset: 0x54c
    flash_properties:
      address_range:
        start: 0x0
        end: 0x80000
      page_size: 0x1000
      erased_byte_value: 0xff
      program_page_timeout: 1000
      erase_sector_timeout: 3000
      sectors:
        - size: 0x1000
          address: 0x0
      cores:
        - main
