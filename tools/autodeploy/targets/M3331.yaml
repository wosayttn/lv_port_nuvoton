---
name: M3331
variants:
  - name: M3331
    cores:
      - name: main
        type: armv8m
        core_access_options: !Arm
          ap: !v1 0
    memory_map:
      - !Ram
        range:
          start: 0x20000000
          end: 0x20020000
        cores:
          - main
      - !Nvm
        range:
          start: 0x0
          end: 0x80000
        cores:
          - main
        access:
          boot: true
    flash_algorithms:
      - M3331_AP_512
flash_algorithms:
  - name: M3331_AP_512
    description: "M3331 APROM 512kB"
    default: true
    instructions: 
    pc_init: 0x0
    pc_uninit: 0x70
    pc_program_page: 0x172
    pc_erase_sector: 0xca
    pc_erase_all: 0x86
    pc_verify: 0x252
    data_section_offset: 0x2c0
    flash_properties:
      address_range:
        start: 0x0
        end: 0x80000
      page_size: 0x400
      erased_byte_value: 0xff
      program_page_timeout: 1000
      erase_sector_timeout: 3000
      sectors:
        - size: 0x400
          address: 0x0
      cores:
        - main
