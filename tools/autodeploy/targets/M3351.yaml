---
name: M3351
variants:
  - name: M3351
    cores:
      - name: main
        type: armv8m
        core_access_options: !Arm
          ap: !v1 0
    memory_map:
      - !Ram
        range:
          start: 0x20000000
          end: 0x20020000
        cores:
          - main
      - !Nvm
        range:
          start: 0x0
          end: 0x80000
        cores:
          - main
        access:
          boot: true
    flash_algorithms:
      - M3351_AP_512
flash_algorithms:
  - name: M3351_AP_512
    description: "M3351 APROM 512kB"
    default: true
    instructions: 
    pc_init: 0x0
    pc_uninit: 0xc2
    pc_program_page: 0x274
    pc_erase_sector: 0xec
    pc_verify: 0x494
    data_section_offset: 0x56c
    flash_properties:
      address_range:
        start: 0x0
        end: 0x80000
      page_size: 0x2000
      erased_byte_value: 0xff
      program_page_timeout: 1000
      erase_sector_timeout: 3000
      sectors:
        - size: 0x2000
          address: 0x0
      cores:
        - main
