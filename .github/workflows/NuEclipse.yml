name: NuEclipse

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wosayttn/numicro-cicd:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - name: Build all Eclipse projects
        shell: bash
        run: |
          REPO_ROOT="$GITHUB_WORKSPACE"
          export PATH="/opt/eclipse-cdt/:/opt/gcc-arm-10.3-2021.07-x86_64-aarch64-none-elf/bin:/opt/gcc-arm-none-eabi-10.3-2021.10-x86_64-linux/bin:$PATH"
          echo $PATH

          echo "✅ Version check"
          arm-none-eabi-gcc --version
          aarch64-none-elf-gcc --version

          mapfile -t solutions < <(find board misc -type f -name .cproject -exec dirname {} \;)
          set +e

          log_dir="$GITHUB_WORKSPACE/build-logs/nueclipse"
          mkdir -p "$log_dir"
          build_failed=0
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          for dir in "${solutions[@]}"; do

            mkdir -p "$GITHUB_WORKSPACE/workspace"
            log_file="$log_dir/$dir.log"
            mkdir -p "$(dirname "$log_file")"

            echo "🔨 Building $dir on $RUNNER_OS (log: $log_file)"
            timeout 5m eclipse \
              -nosplash \
              -application org.eclipse.cdt.managedbuilder.core.headlessbuild \
              -data "$GITHUB_WORKSPACE/workspace" \
              -import "$GITHUB_WORKSPACE/$dir" \
              -build all > "$log_file" 2>&1
            build_status=$?

            if [ "$build_status" -ne 0 ]; then
              build_failed=1
              echo "::error::Build failed: $dir (exit code: $build_status)"
              echo "::group::Failed build log: $dir"
              cat "$log_file"
              echo "::endgroup::"
              rm -rf "$GITHUB_WORKSPACE/workspace"
              continue
            fi
            echo "Build succeeded: $dir"

            echo "🧹 Collecting .bin files"
            bin_files=$(find "$dir" -type f -name "*.bin")
            for bin_file in $bin_files; do
              base_name=$(basename "$bin_file")
              bin_file_relative_path=$(realpath --relative-to="$GITHUB_WORKSPACE" "$bin_file")
              bin_file_dir=$(dirname "$bin_file_relative_path")
              prefix=$(echo "${bin_file_dir}" | tr '/' '_')
              new_name="${prefix}_${base_name}"

              echo "📦 Copying $bin_file → artifacts/$new_name"
              cp "$bin_file" "$GITHUB_WORKSPACE/artifacts/$new_name"
            done

            rm -rf "$GITHUB_WORKSPACE/workspace"
          done
          set -e
          exit "$build_failed"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: lv_port_nuvoton-nueclipse-logs
          path: ${{ github.workspace }}/build-logs/nueclipse/
          if-no-files-found: ignore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: lv_port_nuvoton-nueclipse
          path: ${{ github.workspace }}/artifacts/*.bin
