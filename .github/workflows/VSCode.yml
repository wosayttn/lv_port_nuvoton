name: VSCode

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - name: Install tools
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: ".github/workflows/vcpkg-configuration.json"

      - name: Activate Arm tool license
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Activate & Build each csolution
        shell: bash
        run: |
          log_dir="$GITHUB_WORKSPACE/build-logs/vscode"
          mkdir -p "$log_dir"
          build_failed=0
          mapfile -t solutions < <(find ./board ./misc -name '*.csolution.yml')

          set +e
          for sol in "${solutions[@]}"; do
            proj_dir=$(dirname "$sol")
            proj=$(basename "$sol")
            log_file="$log_dir/${sol#./}.log"
            mkdir -p "$(dirname "$log_file")"
            echo "Building: $sol (log: $log_file)"

            (
              set -e
              cd "$proj_dir"
              echo "Building: $sol"
              echo "current -> $PWD"

              vcpkg activate --downloads-root="$GITHUB_WORKSPACE/.vcpkg/downloads" --json=env.json
              trap 'vcpkg deactivate || true' EXIT
              echo "Preserving vcpkg PATH ..."
              jq '.paths.PATH[]' env.json | tr -d '\"' | tee -a "$GITHUB_PATH"
              echo "Preserving vcpkg ENV ..."
              jq '.tools | to_entries | map("\(.key)=\(.value)")[]' env.json | tr -d '\"' | tee -a "$GITHUB_ENV"

              cbuild "$proj" --update-rte --packs
            ) > "$log_file" 2>&1
            build_status=$?

            if [ "$build_status" -ne 0 ]; then
              build_failed=1
              echo "::error::Build failed: $sol (exit code: $build_status)"
              echo "::group::Failed build log: $sol"
              cat "$log_file"
              echo "::endgroup::"
            else
              echo "Build succeeded: $sol"
            fi
          done
          set -e
          exit "$build_failed"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: lv_port_nuvoton-vscode-logs
          path: ${{ github.workspace }}/build-logs/vscode/
          if-no-files-found: ignore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: lv_port_nuvoton-vscode
          path: |
            **/board/**/*.bin
            **/misc/**/*.bin
